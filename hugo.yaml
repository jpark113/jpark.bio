baseURL: "https://jpark.bio/"
languageCode: "en-us"
title: "James Park"
enableRobotsTXT: true

theme:
  - github.com/adityatelange/hugo-PaperMod
module:
  imports:
    - path: github.com/adityatelange/hugo-PaperMod

outputs:
  home: ["HTML", "RSS", "JSON"]
  section: ["HTML", "RSS"]
  page: ["HTML"]
  taxonomy: ["HTML", "RSS"]
  term: ["HTML", "RSS"]

params:
  env: production
  description: "James Park | U.S.–Japan–Korea relations, digital sovereignty, and northern shipping routes"
  disableThemeToggle: false
  defaultTheme: auto
  ShowShareButtons: false
  hideFooter: true

menu:
  main:
    - name: Home
      url: /
      weight: 10
    - name: Research
      url: /research/
      weight: 20
    - name: Blog
      url: https://jampkd.bearblog.dev/
      weight: 60
    - name: CV
      url: /cv/
      weight: 40
    - name: Contact
      url: /contact/
      weight: 50

markup:
  goldmark:
    renderer:
      unsafe: true
